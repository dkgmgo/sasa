name: sasa_cli
description: "Command-line companion for Sasa, used for background jobs on Linux (brief, tick, suggest, report)."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

executables:
  sasa: sasa

dependencies:
  args: ^2.7.0
  dbus: ^0.8.0
  http: ^1.6.0
  sasa_caldav:
    path: ../../packages/caldav
  sasa_core:
    path: ../../packages/core
  timezone: ^0.11.2

dev_dependencies:
  test: ^1.26.0
