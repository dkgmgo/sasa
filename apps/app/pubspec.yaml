name: sasa
description: "Sasa, a local-first day organiser."
publish_to: none
version: 0.0.1+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  davx_bridge:
    path: ../../packages/davx_bridge
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  saf_folder:
    path: ../../packages/saf_folder
  sasa_caldav:
    path: ../../packages/caldav
  sasa_core:
    path: ../../packages/core
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Lexend-OFL.txt
    - assets/fonts/Inter-OFL.txt
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
