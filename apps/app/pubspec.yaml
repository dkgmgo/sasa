name: sasa
description: "Sasa, a local-first day organiser."
publish_to: none
version: 0.0.1+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  davx_bridge:
    path: ../../packages/davx_bridge
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  saf_folder:
