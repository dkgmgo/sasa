name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: tools/check.sh

  android-plugin:
    name: Android build and plugin unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - name: Build debug APK (compiles the Kotlin plugins)
        working-directory: apps/app
        run: flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: apps/app/android
        run: ./gradlew :davx_bridge:testDebugUnitTest :saf_folder:testDebugUnitTest

  radicale:
    name: CalDAV integration tests (test Radicale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Install podman-compose
        run: pipx install podman-compose
      - run: tools/radicale-test/up.sh
      - run: flutter pub get
      - name: Integration tests
        working-directory: packages/caldav
        run: dart test -P integration test/integration
      - if: always()
        run: tools/radicale-test/down.sh
