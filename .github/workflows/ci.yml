name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: tools/check.sh

  radicale:
    name: Test Radicale starts and seeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install podman-compose
        run: pipx install podman-compose
      - run: tools/radicale-test/up.sh
      - if: always()
        run: tools/radicale-test/down.sh
